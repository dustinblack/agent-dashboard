version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Containerfile
    ports:
      - "8000:8000"
    volumes:
      - dashboard_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/agent_dashboard.db
      # Authentication is enforced by default. To disable
      # for local development, uncomment the next line:
      # - BYPASS_AUTH=true
      # Required when auth is enabled (BYPASS_AUTH unset):
      # - SECRET_KEY=<generate-a-random-secret>
      # - OIDC_CLIENT_ID=<your-oidc-client-id>
      # - OIDC_CLIENT_SECRET=<your-oidc-client-secret>
      # - OIDC_DISCOVERY_URL=<your-oidc-discovery-url>
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Containerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    # Environment variables for build time would be passed here if needed

volumes:
  dashboard_data:
