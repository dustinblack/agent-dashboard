# Gemini CLI agent profile
#
# RETIRED from default installation.
#
# Gemini CLI stopped serving requests for free/personal
# users on June 18, 2026. Google's replacement is
# Antigravity CLI (agy) — see agy.yaml.
#
# Enterprise API key users (Gemini Code Assist
# Standard/Enterprise) can still use Gemini CLI by
# installing it manually inside the container:
#
#   npm install -g @google/gemini-cli
#
# The profile configuration below remains functional —
# the daemon will detect and offer Gemini CLI if the
# binary is present on the host or in the container.
name: gemini
display_name: Gemini (retired)
color: blue
binary: gemini

commands:
  new: ["gemini"]
  resume: ["bash", "-c", "gemini --resume latest || gemini"]

# Gemini uses its own telemetry implementation and does
# NOT honor OTEL_RESOURCE_ATTRIBUTES. The daemon's
# _resolve_agent_id() falls back to tool-type matching.
env:
  GEMINI_CLI_TELEMETRY_ENABLED: "true"
  GEMINI_TELEMETRY_ENABLED: "true"
  GEMINI_TELEMETRY_OTLP_ENDPOINT: "http://127.0.0.1:{otlp_port}"
  GEMINI_TELEMETRY_OTLP_PROTOCOL: "http"
  GEMINI_TELEMETRY_USE_COLLECTOR: "true"
  GEMINI_TELEMETRY_TARGET: "local"

# No auth gate — Gemini CLI supports both API key
# (GEMINI_API_KEY) and Google OAuth (gemini auth login).

mcp:
  user_files:
    - ~/.gemini/settings.json

telemetry:
  token_metrics:
    - gemini_cli.token.usage
  activity_metrics:
    - gemini_cli.tool.call.count
    - gemini_cli.tool.call.latency
  runtime_metric:
    name: gemini_cli.agent.duration
    unit: milliseconds
  excluded_metrics:
    - gen_ai.client.token.usage

permission_patterns:
  - "Allow .+ to run"
  - "Do you want to allow"

# No provisioning section — Gemini CLI is no longer
# installed in the default container build. To use it,
# install manually or add provisioning back via a
# gemini.local.yaml override.
